<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>MathPad feature graphic</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #000; }
  .fg { position: relative; width: 1024px; height: 500px; display: flex; align-items: center; gap: 48px; padding: 0 72px; box-sizing: border-box;
        background: radial-gradient(ellipse 60% 80% at 22% 50%, rgba(255,255,255,.09), transparent 70%), #000; }
  .fg .logo { width: 260px; height: 260px; flex: none; }
  .fg h1 { font-size: 88px; line-height: 1; margin: 0 0 18px; color: #fff; letter-spacing: -.02em; }
  .fg p { font-size: 27px; line-height: 1.35; margin: 0; color: #d4d4d8; white-space: nowrap; }
  .fg small { display: block; margin-top: 22px; font-size: 20px; color: #a1a1aa; letter-spacing: .14em; text-transform: uppercase; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div class="fg" id="fg">
  <div id="logo"></div>
  <div><h1>MathPad</h1><p>Soru çöz, tahtada çiz, devreni simüle et.</p><small>Mühendislik öğrencileri için</small></div>
</div>
<script type="module">
  import { logo } from '../js/ui.js';
  document.getElementById('logo').outerHTML = logo();
  const fg = document.getElementById('fg');
  for (let i = 0; i < 90; i++) { // fixed pseudo-random stars so every render is the same
    const s = document.createElement('i'); s.className = 'star';
    const r = n => ((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1;
    Object.assign(s.style, { left: r(1) * 1024 + 'px', top: r(2) * 500 + 'px', opacity: .15 + r(3) * .6 });
    fg.prepend(s);
  }
</script>
</body>
</html>
